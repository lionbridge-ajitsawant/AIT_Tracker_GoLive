<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIT Tracker Wizard</title>
<style>
  :root { --accent:#0b6bcb; --bg:#f4f6f8; --card:#fff; --line:#dde3ea; }
  * { box-sizing:border-box; }
  body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); margin:0; color:#1b2733; }
  header { background:var(--accent); color:#fff; padding:14px 28px; font-size:18px; font-weight:600;
           display:flex; align-items:baseline; }
  header span { font-weight:300; opacity:.85; font-size:14px; margin-left:10px; }
  header .who { margin-left:auto; font-size:12.5px; font-weight:400; opacity:.9; }
  header .who a { color:#fff; }
  main { max-width:1080px; margin:24px auto; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px 26px; margin-bottom:20px; }
  h2 { margin-top:0; font-size:17px; }
  h3 { font-size:15px; margin:4px 0 10px; }
  label { font-size:13px; color:#445; }
  input[type=text], input[type=url], select, textarea {
    font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line);
    border-radius:6px; width:100%; background:#fff; }
  textarea { resize:vertical; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:#56657a; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:none; border-radius:8px;
         padding:10px 22px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .muted { color:#69788c; font-size:12.5px; }
  .pill { display:inline-block; background:#e8f0fb; color:var(--accent); border-radius:99px;
          padding:2px 10px; font-size:12px; margin:2px 4px 2px 0; }
  .ok { color:#1d7a3e; font-weight:600; }
  .err { color:#b3261e; font-weight:600; }
  pre.log { background:#10161d; color:#cfe3f5; padding:14px; border-radius:8px;
            font-size:12.5px; max-height:420px; overflow:auto; white-space:pre-wrap; }
  .steps { display:flex; gap:8px; margin-bottom:18px; font-size:12.5px; color:#69788c; }
  .steps b { color:var(--accent); }
</style>
</head>
<body>
<header>AIT Tracker Wizard <span>Excel tracker &rarr; SharePoint Lists, self-service</span>
{% if current_user %}<span class="who">Signed in as {{ current_user }} &middot; <a href="/.auth/logout">Sign out</a></span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
